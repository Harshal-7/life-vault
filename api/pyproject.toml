[project]
name = "life-vault-api"
version = "0.1.0"
description = "FastAPI backend and background worker for Life Vault"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146.0",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
